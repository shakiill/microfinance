{% extends 'includes/main.html' %}
{% load render_table from django_tables2 %}

{% block content %}
    <div class="container-fluid">
        <div class="row">
            <div class="col">
                <div class="card card-custom gutter-b">
                    <div class="card-header">
                        <div class="card-title">
                            <h3 class="card-label">{{ page_title }}</h3>
                        </div>
                        <div class="card-toolbar">
                            {% if add_link %}
                                <a href="{{ add_link }}" class="btn btn-info">Add New</a>
                            {% endif %}
                        </div>
                    </div>
                    <div class="card-body">
                        {% if filter %}
                            {% include 'includes/filter.html' %}
                        {% endif %}
                        <div class="table-responsive">
                            {% render_table table %}
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
{% endblock %}
{% block js %}
    <script>
        // static/js/investment-modals.js
        document.addEventListener('DOMContentLoaded', function () {
            // Initialize form validation
            const editForms = document.querySelectorAll('.edit-investment-form');
            editForms.forEach(form => {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                });
            });

            // Add AJAX handling if needed
            const editModals = document.querySelectorAll('[id^="editModal-"]');
            editModals.forEach(modal => {
                modal.addEventListener('shown.bs.modal', function () {
                    // Focus on first input when modal opens
                    const firstInput = modal.querySelector('input:not([type="hidden"])');
                    if (firstInput) {
                        firstInput.focus();
                    }
                });
            });
        });
    </script>
{% endblock %}
